name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (all workspaces)
        run: npx vitest run

      - name: Check coverage thresholds
        run: npm run test:coverage
        working-directory: packages/svg-scroll-draw

      - name: Build library
        run: npm run build:lib

      - name: Type check demo
        run: npx tsc --noEmit
        working-directory: apps/demo
