name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    # A job without a limit runs GitHub's default of 6 hours. On 2026-11-06 a
    # browser job hung on "Install Playwright browsers" for 47 minutes and
    # counting while the next run's took 2. Each limit is about 3x a normal run.
    timeout-minutes: 15

    # Node 20 left support in April 2026; Vercel builds the site on 24.
    # `@types/node` in apps/demo follows the oldest version here.
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the sitemap date check reads each page's last commit,
          # and in a shallow clone every file was last changed by this one.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck the library, not just the demo. A `startTime = null` type
      # error sat in core/engine.ts across several releases because tsup
      # transpiles without typechecking and CI only ever checked apps/demo.
      - name: Type check library
        run: npm run typecheck
        working-directory: packages/svg-scroll-draw

      # Build before the demo typecheck: the demo resolves svg-scroll-draw through
      # dist/, so checking it first meant checking against whatever `npm ci`'s
      # hidden `prepare` build left there. The 2.13.0 release run failed that way
      # (scrollHorizontal untyped in one run) on a commit that passed everywhere else.
      - name: Build library
        run: npm run build:lib

      - name: Type check demo
        run: npx tsc --noEmit
        working-directory: apps/demo

      # The demo carried 52 lint errors for months because nothing ran eslint.
      # check-jsx-text: SWC drops the space in front of a multi-line JSX text
      # that contains an HTML entity, which had run words together on 22 lines.
      # build-registry --check: the published block JSON must match its source;
      # it only ran inside the Vercel build before.
      - name: Lint demo
        run: npm run lint -- --max-warnings=0 && node scripts/check-jsx-text.mjs && node scripts/check-nav.mjs && node scripts/build-registry.mjs --check && node scripts/refresh-sitemap-dates.mjs --check
        working-directory: apps/demo

      - name: Run tests (all workspaces)
        run: npx vitest run

      - name: Check coverage thresholds
        run: npm run test:coverage
        working-directory: packages/svg-scroll-draw

      # Fails if any entry point outgrows its budget, so the size figures
      # quoted in README.md cannot silently go stale again.
      - name: Check bundle size budgets
        run: npm run size:check
        working-directory: packages/svg-scroll-draw

      # Fails if a mutation's anchor no longer applies to its file. The full
      # mutation run rebuilds once per mutation and takes hours, so it is rare;
      # this catches a refactor that moved an anchor in seconds.
      - name: Check mutation anchors
        run: node scripts/mutation-check.mjs --anchors
        working-directory: packages/svg-scroll-draw

      # The rule release.yml uses to give only the newest version npm's
      # `latest`: a broken script should fail here, not on release day.
      - name: Check the release dist-tag rule
        run: node scripts/release-dist-tag.mjs --self-test

      # Fails if the test/example counts quoted in the README or demo drift
      # from the real numbers.
      - name: Check doc claims
        run: npm run check:claims

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's own image: the three browsers and every library they need,
    # pulled from Microsoft's registry. On 2026-11-11 the runners could not
    # resolve *.ubuntu.com for hours, so `playwright install --with-deps` sat in
    # apt until the job limit, on CI and on the release. The tag must match the
    # lockfile's playwright version, or the tests look for browsers it lacks.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The unit tests run in jsdom with getTotalLength stubbed and
      # IntersectionObserver faked, so they cannot verify browser behaviour. These
      # do — including that the native CSS fast path and the JS engine produce the
      # same output, which is the library's headline claim.
      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: packages/svg-scroll-draw

      # Each site recipe's paste-able HTML file, run against the same dist/:
      # a listing nobody ran is the easiest thing on the site to get wrong.
      - name: Recipe files work in a browser
        run: node apps/demo/scripts/test-recipes.mjs

      # The site renders the React blocks; nothing else would notice a Vue
      # version that does not compile or never starts its engine.
      - name: Vue blocks compile and run
        run: node apps/demo/scripts/test-vue-blocks.mjs

      - name: Svelte blocks compile and run
        run: node apps/demo/scripts/test-svelte-blocks.mjs

      # The React blocks run on /blocks itself: build the site, serve it and
      # scroll through each block in Chromium.
      - name: Build the demo
        run: npm run build -w demo

      # One server for all four: the blocks on /blocks; every sitemap page
      # through axe (WCAG 2.1 A and AA) and every internal link and #anchor;
      # what a crawler reads on each (title, description, canonical, h1,
      # preview image, JSON-LD, inbound links); and the showcase sites, which
      # the sitemap leaves out, for page errors and colour contrast.
      - name: Blocks work on /blocks, every page passes axe, its links and the SEO check, and the showcase sites pass contrast
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/blocks > /dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3100 node scripts/test-blocks.mjs
          BASE_URL=http://localhost:3100 node scripts/test-a11y.mjs
          BASE_URL=http://localhost:3100 node scripts/test-seo.mjs
          BASE_URL=http://localhost:3100 node scripts/test-showcase.mjs
        working-directory: apps/demo

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/svg-scroll-draw/playwright-report/
          retention-days: 14
