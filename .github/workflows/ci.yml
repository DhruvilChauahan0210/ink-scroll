name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck the library, not just the demo. A `startTime = null` type
      # error sat in core/engine.ts across several releases because tsup
      # transpiles without typechecking and CI only ever checked apps/demo.
      - name: Type check library
        run: npm run typecheck
        working-directory: packages/svg-scroll-draw

      - name: Type check demo
        run: npx tsc --noEmit
        working-directory: apps/demo

      - name: Run tests (all workspaces)
        run: npx vitest run

      - name: Check coverage thresholds
        run: npm run test:coverage
        working-directory: packages/svg-scroll-draw

      - name: Build library
        run: npm run build:lib

      # Fails if any entry point outgrows its budget, so the size figures
      # quoted in README.md cannot silently go stale again.
      - name: Check bundle size budgets
        run: npm run size:check
        working-directory: packages/svg-scroll-draw

      # Fails if the test/example counts quoted in the README or demo drift
      # from the real numbers.
      - name: Check doc claims
        run: npm run check:claims
