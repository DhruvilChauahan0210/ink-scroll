name: Release

# Publishing was previously manual from a laptop, which meant no reproducible
# build and no provenance attestation on npm. This runs the full verification
# gauntlet first and then publishes with provenance, so each released version is
# cryptographically linked to the commit and workflow run that produced it.
#
# To cut a release:
#   1. bump "version" in packages/svg-scroll-draw/package.json
#   2. move the CHANGELOG [Unreleased] section under the new version
#   3. commit, then: git tag v2.10.0 <sha> && git push origin v2.10.0
#      Several tags at once are safe: only the newest takes npm's `latest` and
#      GitHub's latest release (see "Decide the dist-tag" below).
#
# Authenticates with npm's trusted publishing: npm trusts this workflow
# (DhruvilChauahan0210/ink-scroll, release.yml; package Settings -> Trusted
# Publisher on npmjs.com) and swaps the job's OIDC token for a short-lived
# publish token, so no npm token exists anywhere. First used for 2.20.0, whose
# `npm view svg-scroll-draw@2.20.0 _npmUser` is GitHub Actions. There is no
# fallback: if that setting is removed or the workflow file is renamed, the
# publish step fails rather than reaching for a token.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check but do not publish'
        type: boolean
        default: true

# One release per tag at a time. Re-pushing a tag while its run was still going
# started a second run on the same commit; both reached `npm publish` within
# seconds and v2.15.3's watched run lost with E409. A second run now waits for
# the first and stops at "Confirm this version is not already published".
# Never cancel in progress: a run stopped mid-publish can leave npm and the
# GitHub release out of step.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify & publish
    runs-on: ubuntu-latest
    # About 3x a normal run (9.5 minutes). A hang fails here instead of holding
    # the tag's release for GitHub's default 6 hours.
    timeout-minutes: 30

    permissions:
      # write: the last step creates the GitHub release. With `read`, 2.10.1
      # published to npm and then failed here with a 403.
      contents: write
      # Mints the OIDC token npm exchanges for a publish token (trusted
      # publishing) and signs the provenance statement with.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for verify's sitemap date check (see ci.yml).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/svg-scroll-draw

      # Everything CI runs, plus the browser tests. A release should not be able
      # to skip a gate that a pull request cannot.
      - name: Verify
        run: npm run verify

      - name: Browser tests
        run: npm run test:e2e
        working-directory: packages/svg-scroll-draw

      # A tag that disagrees with package.json produces a confusing release, so
      # fail loudly rather than publishing the wrong number.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/svg-scroll-draw/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing $PKG"

      - name: Confirm this version is not already published
        run: |
          PKG=$(node -p "require('./packages/svg-scroll-draw/package.json').version")
          if npm view "svg-scroll-draw@$PKG" version >/dev/null 2>&1; then
            echo "::error::svg-scroll-draw@$PKG is already on npm"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      # Only here, so the install and the tests above keep the npm they ran on.
      # It runs on a dry run too, which is how a change to it gets tested.
      - name: Use npm 11
        run: npm install -g npm@11 && npm --version

      # Only the newest version takes `latest`. On 2026-11-07 four tags pushed
      # within two minutes ran at once (the concurrency group above is per tag),
      # npm processed 2.23.0 before 2.21.0 and 2.22.0, and `latest` ended on
      # 2.22.0, on npm and on GitHub. A single repo-wide group would not help:
      # GitHub keeps one pending run per group and cancels the rest, which would
      # drop releases. So each run decides here, at publish time, against every
      # release tag (fetched again: a newer one may have been pushed after this
      # run checked out) and npm's current `latest`. An older version publishes
      # as `previous`, a prerelease as `next`. Runs on a dry run too.
      - name: Decide the dist-tag
        id: disttag
        run: |
          node scripts/release-dist-tag.mjs --self-test
          git fetch --force --tags --quiet origin
          VERSION=$(node -p "require('./packages/svg-scroll-draw/package.json').version")
          NPM_LATEST=$(npm view svg-scroll-draw dist-tags.latest 2>/dev/null || true)
          node scripts/release-dist-tag.mjs "$VERSION" "$NPM_LATEST" $(git tag --list 'v*' | sed 's/^v//') | tee -a "$GITHUB_OUTPUT"

      - name: Publish to npm with provenance
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        # Trusted publishing signs the provenance statement by itself.
        run: npm publish --access public --tag "${{ steps.disttag.outputs.tag }}"
        working-directory: packages/svg-scroll-draw

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          echo "### Dry run — nothing published" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed. Files that would ship:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm pack --dry-run --workspace=packages/svg-scroll-draw 2>&1 | tail -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # The same decision as npm's dist-tag: only the newest is GitHub's latest.
          make_latest: ${{ steps.disttag.outputs.latest }}
          prerelease: ${{ steps.disttag.outputs.prerelease }}
          body: |
            Published to npm with [provenance](https://docs.npmjs.com/generating-provenance-statements).
            Verify with `npm audit signatures`.

            See [CHANGELOG.md](https://github.com/DhruvilChauahan0210/ink-scroll/blob/main/CHANGELOG.md) for details.
