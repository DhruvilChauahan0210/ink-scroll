version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The library ships zero runtime dependencies, so everything here is dev
      # tooling. Grouping keeps the PR volume sane on a small project.
      dev-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Majors for these change build output or test semantics — worth doing
      # deliberately rather than as an automated PR.
      - dependency-name: tsup
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      # Has to share vitest's major; a coverage-v8 5 PR against vitest 2 fails.
      - dependency-name: "@vitest/coverage-v8"
        update-types: [version-update:semver-major]
      - dependency-name: "@playwright/test"
        update-types: [version-update:semver-major]
      # Blocked upstream, checked 2026-11-06. TypeScript 7's package has no
      # compiler API and typescript-eslint (behind eslint-config-next) accepts
      # TypeScript < 6.1. ESLint 10 is past the peer range of eslint-plugin-react,
      # -import and -jsx-a11y, which eslint-config-next bundles. Revisit when
      # those move.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Matches the oldest Node CI runs (22, the matrix in ci.yml); types for a
      # newer Node let code use APIs that runtime does not have. Move with the
      # matrix.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
