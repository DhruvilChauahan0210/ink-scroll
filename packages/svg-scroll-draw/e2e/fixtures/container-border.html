<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A scroll container with a border: the JS window against CSS view()</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body { margin: 0; font: 13px/1.4 ui-monospace, monospace; }
  /* 400px tall with a 30px border and 20px of top padding: the scrollport (the
     padding box) is 340px tall and starts 30px inside the border box. */
  #box {
    position: relative; width: 600px; height: 400px; margin: 40px;
    border: 30px solid #345; padding-top: 20px; overflow-y: auto;
  }
  .lead { height: 600px; background: #eee; }
  .row  { display: flex; gap: 40px; height: 100px; }
  .cell { flex: 1; height: 100px; background: #0a7; }
  /* The browser's own answer: a view() timeline on the nearest scroller, #box. */
  @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
  #css {
    animation: reveal linear both;
    animation-timeline: view();
    animation-range: cover 0% cover 100%;
  }
  .tail { height: 700px; }
</style>
</head>
<body>
<div id="box">
  <div class="lead"></div>
  <div class="row"><div class="cell" id="css"></div><div class="cell" id="js"></div></div>
  <div class="tail"></div>
</div>
<script type="module">
import { scrollAnimate } from '/dist/index.mjs';
import { publish, opacityOf } from './_probe.mjs';

const box = document.getElementById('box');
const js = document.getElementById('js');
// A scrollContainer is never native, so this is the JS engine's window.
scrollAnimate(js, { props: { opacity: [0, 1] }, easing: 'linear', scrollContainer: box });

publish({
  scrollTo: (y) => { box.scrollTop = y; },
  read: () => {
    // The window as CSS defines it, from layout: the cell's top in the scroll
    // content (offsetTop, from the padding edge) less the scrollport's height,
    // to its bottom.
    const top = js.offsetTop, h = js.offsetHeight, port = box.clientHeight;
    const expected = Math.min(1, Math.max(0, (box.scrollTop - (top - port)) / (port + h)));
    return {
      scrollY: box.scrollTop,
      js: opacityOf(js),
      css: CSS.supports('animation-timeline: view()') ? opacityOf(document.getElementById('css')) : null,
      expected,
    };
  },
});
</script>
</body>
</html>
