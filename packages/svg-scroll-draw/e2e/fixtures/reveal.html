<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scrollReveal — real transforms, stagger cascade, once latching</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body { margin: 0; font: 13px/1.4 ui-monospace, monospace; }

  .spacer { height: 1200px; }
  .tail   { height: 1600px; }

  /* Cards sit in a row, so every card in a row shares one document Y. That makes
     the stagger offset the ONLY thing that can make their progress differ —
     stacked cards would differ simply by being at different heights, which would
     pass whether stagger worked or not. Same trick as parity.html. */
  .row { display: flex; gap: 20px; padding: 0 20px; }
  .card, .rev, .cust { flex: 1; height: 120px; background: #cde; }
</style>
</head>
<body>

<div class="spacer"></div>

<!-- rowA: document top 1200 -->
<div class="row" id="rowA">
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
  <div class="card"></div>
</div>

<div class="spacer"></div>

<!-- rowB: document top 2520 -->
<div class="row" id="rowB">
  <div class="rev"></div>
  <div class="rev"></div>
</div>

<div class="spacer"></div>

<!-- rowC: document top 3840 — a custom trigger, which used to switch stagger off -->
<div class="row" id="rowC">
  <div class="cust"></div>
  <div class="cust"></div>
  <div class="cust"></div>
</div>

<div class="tail"></div>

<script type="module">
import { scrollReveal } from '/dist/reveal/index.mjs';
import { transformOf, opacityOf, docTop, publish } from './_probe.mjs';

const cards = [...document.querySelectorAll('.card')];
const revs  = [...document.querySelectorAll('.rev')];
const custs = [...document.querySelectorAll('.cust')];

// The default stagger (0.15 of the reveal window per card in a row). Up to
// 2.15.2 the default was a 2.5px offset at this viewport — below the noise
// floor — so the spec also checks the size of each step, not just its order.
const staggered = scrollReveal(cards, { once: true });

// A custom trigger must keep its stagger (it used to drop it entirely).
const custom = scrollReveal(custs, { stagger: 0.2, once: true, trigger: { start: 'top 80%', end: 'top 40%' } });

// once:false — must genuinely reverse on the way back up.
const reversing = scrollReveal(revs, { preset: 'scale', once: false });

const state = (el) => ({
  opacity: opacityOf(el),
  ...transformOf(el),
  inlineOpacity:   el.style.opacity,
  inlineTransform: el.style.transform,
});

publish({
  read: () => ({
    scrollY: window.scrollY,
    cards: cards.map(state),
    revs:  revs.map(state),
    custs: custs.map(state),
  }),
  geometry: () => ({
    rowATop: docTop(document.querySelector('#rowA')),
    rowBTop: docTop(document.querySelector('#rowB')),
    rowCTop: docTop(document.querySelector('#rowC')),
    viewport: window.innerHeight,
  }),
  destroyStaggered: () => staggered.destroy(),
  destroyReversing: () => reversing.destroy(),
  destroyCustom: () => custom.destroy(),
});
</script>
</body>
</html>
