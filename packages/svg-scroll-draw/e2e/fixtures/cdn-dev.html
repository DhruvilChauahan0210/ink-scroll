<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CDN dev build — diagnostics reach a script-tag user</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body { margin: 0; font: 13px/1.4 ui-monospace, monospace; }
  #box { height: 300px; margin: 400px 40px; }
  svg { width: 100%; height: 100%; display: block; }
  /* The stroke comes from CSS rather than a `stroke` attribute — a completely
     ordinary thing to do, and the case the engine warns about. */
  #box path { fill: none; stroke: #000; stroke-width: 3; }
</style>
</head>
<body>

<div id="box">
  <svg viewBox="0 0 200 100" preserveAspectRatio="none">
    <path d="M10 50 C 40 10, 80 10, 100 50 S 160 90, 190 50"></path>
  </svg>
</div>

<!--
  A plain classic script tag, exactly as the README advertises: no bundler, no
  module graph, no `process`. Which build is loaded is chosen by ?build=dev|prod
  so one fixture can prove both halves of the claim.
-->
<script>
  window.__warnings = [];
  const nativeWarn = console.warn.bind(console);
  console.warn = (...args) => { window.__warnings.push(args.map(String).join(' ')); nativeWarn(...args); };

  const build = new URLSearchParams(location.search).get('build') === 'dev'
    ? 'svg-scroll-draw.dev.global.js'
    : 'svg-scroll-draw.global.js';

  const s = document.createElement('script');
  s.src = `/dist/cdn/${build}`;
  s.onload = () => {
    const api = window.SvgScrollDraw;

    // 1. A path with no `stroke` attribute → the "no stroke" dev warning.
    api.scrollDraw('#box');

    // 2. A target that does not exist → the "container not found" dev warning.
    api.scrollDraw('#does-not-exist');

    window.__probe = {
      read: () => ({
        globalPresent: typeof api === 'object',
        exports: Object.keys(api).sort(),
        // The web component registers itself as a side effect of the CDN entry.
        customElementDefined: !!customElements.get('scroll-draw'),
        warnings: window.__warnings.slice(),
      }),
    };
    window.__ready = true;
  };
  s.onerror = () => {
    window.__probe = { read: () => ({ globalPresent: false, exports: [], customElementDefined: false, warnings: ['SCRIPT FAILED TO LOAD'] }) };
    window.__ready = true;
  };
  document.head.appendChild(s);
</script>
</body>
</html>
