<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll-scrubbed product film</title>
  <style>
    body { margin: 0; background: #121212; }
    .spacer { height: 100vh; }

    /* The track holds the scroll room: the stage stays stuck for its height minus
       one screen, and the film runs exactly that long. */
    .film-track {
      --ink: #ece8e1;
      --paper: #121212;
      --accent: #d0a15c;
      position: relative;
      height: 400vh;
      background: var(--paper);
      color: var(--ink);
    }

    .film-stage {
      position: sticky;
      top: 0;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      align-items: center;
      gap: 48px;
      height: 100vh;
      height: 100svh;
      padding: 0 6vw;
    }
    .film-stage video { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; }

    .film-copy { display: grid; gap: 28px; margin: 0; padding: 0; list-style: none; }
    /* Not the current chapter: greyed by colour, not opacity, so it keeps WCAG AA
       (#817f7c is 4.7:1 on the film's ground, the dimmed gold 4.65:1). */
    .film-copy li { color: #817f7c; transition: color 0.3s ease; }
    .film-copy li[aria-current] { color: var(--ink); }
    .film-copy li:not([aria-current]) .film-n { color: #9b7947; }
    .film-n { font: 600 12px/1 ui-monospace, monospace; color: var(--accent); }
    .film-copy h3 { margin: 8px 0 6px; font: 600 24px/1.2 system-ui, sans-serif; }
    .film-copy p { max-width: 34ch; margin: 0; font: 400 16px/1.6 system-ui, sans-serif; }

    /* On a phone the stage still has to fit one screen: one chapter at a time. */
    @media (max-width: 720px) {
      .film-stage { grid-template-columns: minmax(0, 1fr); align-content: center; gap: 20px; }
      .film-copy li:not([aria-current]) { display: none; }
    }

    /* Reduced motion shows the film's last frame, so the chapters cannot be
       scrolled through: show them all. */
    @media (prefers-reduced-motion: reduce) {
      .film-copy li { color: var(--ink); transition: none; }
      .film-copy li:not([aria-current]) .film-n { color: var(--accent); }
      .film-copy li:not([aria-current]) { display: block; }
    }
  </style>
</head>
<body>
  <div class="spacer"></div>

  <section class="film-track" id="track">
    <div class="film-stage">
      <video id="film" src="film.webm" muted playsinline preload="auto" aria-label="The headphones turning, then taken apart"></video>
      <ol class="film-copy">
        <li aria-current="step" data-from="0">
          <span class="film-n">01</span>
          <h3>Built to be worn all day</h3>
          <p>A sprung steel band and memory-foam cushions, 254 g all in.</p>
        </li>
        <li data-from="0.45">
          <span class="film-n">02</span>
          <h3>Taken apart</h3>
          <p>The cup comes apart layer by layer: the cap, the shell, the board.</p>
        </li>
        <li data-from="0.75">
          <span class="film-n">03</span>
          <h3>The part you hear</h3>
          <p>A 40 mm driver with a beryllium-coated dome, 4 Hz to 40 kHz.</p>
        </li>
      </ol>
    </div>
  </section>

  <div class="spacer"></div>

  <script type="module">
    import { scrollVideo } from 'https://cdn.jsdelivr.net/npm/svg-scroll-draw@2.27.1/dist/video/index.mjs';

    const chapters = [...document.querySelectorAll('.film-copy li')];
    let shown = 0;

    scrollVideo(document.getElementById('film'), {
      // The stage is sticky, so the video's own box moves with the scroll.
      // Measure the track that holds the scroll room instead.
      triggerElement: document.getElementById('track'),
      trigger: { start: 'top top', end: 'bottom bottom' },
      onProgress: (p) => {
        const i = chapters.reduce((at, li, j) => (p >= Number(li.dataset.from) ? j : at), 0);
        if (i === shown) return;
        chapters[shown].removeAttribute('aria-current');
        chapters[i].setAttribute('aria-current', 'step');
        shown = i;
      },
    });
  </script>
</body>
</html>
